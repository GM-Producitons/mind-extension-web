<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --line: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1419;
          --fg: #f5f5f5;
          --line: #3a4557;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.4 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.125rem;
      }
      a {
        display: flex;
        align-items: center;
        height: 2.75rem;
        border-bottom: 1px solid var(--line);
        color: inherit;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <a href="/myinsta">MyInsta</a>
    </main>
  </body>
</html>
